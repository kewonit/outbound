<body class="fill">

<header class="topbar">
  <div class="wrap topbar-inner">
    <a class="mark-logo" href="/hi/" aria-label="Outbound होम" data-i18n-attr="aria-label=nav.home"><span class="mark mark-md" aria-hidden="true"></span></a>
    <div class="topbar-actions">

      <a class="btn btn-light btn-sm" href="/hi/#buy" data-url="buy" data-soon="जल्द आ रहा है" data-i18n="buy.button" data-i18n-attr="data-soon=buy.soon">$7 में ख़रीदें</a>
    </div>
  </div>
</header>

<main class="page">
  <div class="wrap-narrow prose">
    <h1 data-i18n="feedback.title">फ़ीडबैक।</h1>
    <p class="lede" data-i18n="feedback.lede">क्या अच्छा चल रहा है, क्या नहीं, आगे क्या चाहिए। यह सीधे Outbound बनाने वाले तक पहुँचता है।</p>

    <!-- Posts, so nothing written here ends up in a page's address. feedback.js sends it and answers in place. -->
    <form class="page-form" id="feedback" action="/api/feedback" method="post" novalidate>
      <textarea class="field" name="message" required maxlength="2000" rows="6" placeholder="आपका फ़ीडबैक" aria-label="आपका फ़ीडबैक"
                data-i18n-attr="placeholder=feedback.message aria-label=feedback.message"></textarea>
      <div class="form-row">
        <input class="field" type="email" name="email" maxlength="254" autocomplete="email" inputmode="email" spellcheck="false" autocapitalize="off"
               placeholder="आपका ईमेल (वैकल्पिक)" aria-label="आपका ईमेल (वैकल्पिक)" data-i18n-attr="placeholder=feedback.email aria-label=feedback.email">
        <button class="btn btn-light" type="submit" data-i18n="feedback.button">भेजें</button>
      </div>
      <!-- Left empty by people, filled in by bots. -->
      <div class="trap" aria-hidden="true"><label>Leave this empty <input type="text" name="hp" tabindex="-1" autocomplete="off"></label></div>
      <p class="form-status" id="feedback-status" role="alert"></p>
    </form>
    <p class="form-done" id="feedback-done" role="status" tabindex="-1" hidden></p>
  </div>
</main>

<footer class="footer footer-plain">
  <div class="wrap-narrow">
    <p class="form-fine" data-i18n="feedback.fine">इसे सिर्फ़ Outbound बनाने वाला ही पढ़ता है। आपका ईमेल सिर्फ़ जवाब देने के लिए इस्तेमाल होता है। <a href="/privacy">गोपनीयता (अंग्रेज़ी)</a></p>
    <div class="lang-picker">
      <label for="language" data-i18n="footer.language">भाषा</label>
      <select id="language" data-lang-picker>
        <option value="en">English</option>
        <option value="es">Español</option>
        <option value="fr">Français</option>
        <option value="de">Deutsch</option>
        <option value="it">Italiano</option>

        <option value="hi" selected>हिन्दी</option>
        <option value="ar">العربية</option>
      </select>
    </div>
  </div>
</footer>
