     what it sends. Not for search engines, so it has no other languages listed. -->

<head>

<meta name="viewport" content="width=device-width, initial-scale=1">
<title data-i18n="feedback.metaTitle">Feedback · Outbound</title>
<meta name="description" content="Sag der Person, die Outbound gemacht hat, was gut ist, was nicht und was du dir als Nächstes wünschst." data-i18n-attr="content=feedback.metaDescription">
<link rel="canonical" href="https://outbound.edbn.me/de/feedback">
<meta name="robots" content="noindex">
<meta name="theme-color" content="#000000">
<meta property="og:type" content="website">
<meta property="og:url" content="https://outbound.edbn.me/de/feedback">
<meta property="og:title" content="Feedback · Outbound" data-i18n-attr="content=feedback.metaTitle">
<meta property="og:description" content="Sag der Person, die Outbound gemacht hat, was gut ist, was nicht und was du dir als Nächstes wünschst." data-i18n-attr="content=feedback.metaDescription">

<meta name="twitter:image:alt" content="Outbound: eine gemalte Welt, die hinter deinem Schreibtisch vorbeizieht." data-i18n-attr="content=meta.imageAlt">

<body class="fill">

<header class="topbar">
  <div class="wrap topbar-inner">
    <a class="mark-logo" href="/de/" aria-label="Outbound-Startseite" data-i18n-attr="aria-label=nav.home"><span class="mark mark-md" aria-hidden="true"></span></a>
    <div class="topbar-actions">
      <a class="btn btn-dark btn-sm" href="https://github.com/kewonit/outbound" data-url="github">GitHub</a>
      <a class="btn btn-light btn-sm" href="/de/#buy" data-url="buy" data-soon="Bald verfügbar" data-i18n="buy.button" data-i18n-attr="data-soon=buy.soon">Für $7 kaufen</a>
    </div>
  </div>
</header>

<main class="page">
  <div class="wrap-narrow prose">
    <h1 data-i18n="feedback.title">Feedback.</h1>
    <p class="lede" data-i18n="feedback.lede">Was gut ist, was nicht, was du dir als Nächstes wünschst. Es geht direkt an die Person, die Outbound gemacht hat.</p>

    <!-- Posts, so nothing written here ends up in a page's address. feedback.js sends it and answers in place. -->
    <form class="page-form" id="feedback" action="/api/feedback" method="post" novalidate>
      <textarea class="field" name="message" required maxlength="2000" rows="6" placeholder="Dein Feedback" aria-label="Dein Feedback"
                data-i18n-attr="placeholder=feedback.message aria-label=feedback.message"></textarea>
      <div class="form-row">
        <input class="field" type="email" name="email" maxlength="254" autocomplete="email" inputmode="email" spellcheck="false" autocapitalize="off"
               placeholder="Deine E-Mail (optional)" aria-label="Deine E-Mail (optional)" data-i18n-attr="placeholder=feedback.email aria-label=feedback.email">
        <button class="btn btn-light" type="submit" data-i18n="feedback.button">Senden</button>
      </div>
      <!-- Left empty by people, filled in by bots. -->
      <div class="trap" aria-hidden="true"><label>Leave this empty <input type="text" name="hp" tabindex="-1" autocomplete="off"></label></div>
      <p class="form-status" id="feedback-status" role="alert"></p>
    </form>
    <p class="form-done" id="feedback-done" role="status" tabindex="-1" hidden></p>
  </div>
</main>

<footer class="footer footer-plain">
  <div class="wrap-narrow">
    <p class="form-fine" data-i18n="feedback.fine">Nur die Person, die Outbound gemacht hat, liest es. Deine E-Mail dient nur für eine Antwort. <a href="/privacy">Datenschutz (Englisch)</a></p>
    <div class="lang-picker">
      <label for="language" data-i18n="footer.language">Sprache</label>
      <select id="language" data-lang-picker>
        <option value="en">English</option>
        <option value="es">Español</option>
        <option value="fr">Français</option>
        <option value="de" selected>Deutsch</option>
        <option value="it">Italiano</option>
        <option value="pt-br">Português (Brasil)</option>
        <option value="nl">Nederlands</option>
        <option value="ru">Русский</option>
        <option value="tr">Türkçe</option>
        <option value="pl">Polski</option>
        <option value="ja">日本語</option>
        <option value="ko">한국어</option>
        <option value="zh-hans">简体中文</option>
        <option value="zh-hant">繁體中文</option>
        <option value="hi">हिन्दी</option>
        <option value="ar">العربية</option>
      </select>
    </div>
  </div>
</footer>

</body>
