<body class="fill">

<header class="topbar">
  <div class="wrap topbar-inner">
    <a class="mark-logo" href="/zh-hans/" aria-label="Outbound 首页" data-i18n-attr="aria-label=nav.home"><span class="mark mark-md" aria-hidden="true"></span></a>
    <div class="topbar-actions">
      <a class="btn btn-dark btn-sm" href="https://github.com/kewonit/outbound" data-url="github">GitHub</a>
      <a class="btn btn-light btn-sm" href="/zh-hans/#buy" data-url="buy" data-soon="即将推出" data-i18n="buy.button" data-i18n-attr="data-soon=buy.soon">$4.99 购买</a>
    </div>
  </div>
</header>

<main class="page">
  <div class="wrap-narrow prose">
    <h1 data-i18n="feedback.title">反馈。</h1>
    <p class="lede" data-i18n="feedback.lede">哪里好用，哪里不好用，接下来想要什么。直接送到 Outbound 的开发者本人手里。</p>

    <!-- Posts, so nothing written here ends up in a page's address. feedback.js sends it and answers in place. -->
    <form class="page-form" id="feedback" action="/api/feedback" method="post" novalidate>
      <textarea class="field" name="message" required maxlength="2000" rows="6" placeholder="你的反馈" aria-label="你的反馈"
                data-i18n-attr="placeholder=feedback.message aria-label=feedback.message"></textarea>
      <div class="form-row">
        <input class="field" type="email" name="email" maxlength="254" autocomplete="email" inputmode="email" spellcheck="false" autocapitalize="off"
               placeholder="你的邮箱（可选）" aria-label="你的邮箱（可选）" data-i18n-attr="placeholder=feedback.email aria-label=feedback.email">
        <button class="btn btn-light" type="submit" data-i18n="feedback.button">发送</button>
      </div>
      <!-- Left empty by people, filled in by bots. -->
      <div class="trap" aria-hidden="true"><label>Leave this empty <input type="text" name="hp" tabindex="-1" autocomplete="off"></label></div>
      <p class="form-status" id="feedback-status" role="alert"></p>
    </form>
    <p class="form-done" id="feedback-done" role="status" tabindex="-1" hidden></p>
  </div>
</main>

<footer class="footer footer-plain">
  <div class="wrap-narrow">
    <p class="form-fine" data-i18n="feedback.fine">只有 Outbound 的开发者本人会读。邮箱只用于回复你。<a href="/privacy">隐私政策（英文）</a></p>
    <div class="lang-picker">
      <label for="language" data-i18n="footer.language">语言</label>
      <select id="language" data-lang-picker>
        <option value="en">English</option>
        <option value="es">Español</option>
        <option value="fr">Français</option>
        <option value="de">Deutsch</option>
        <option value="it">Italiano</option>
        <option value="pt-br">Português (Brasil)</option>
        <option value="nl">Nederlands</option>
        <option value="ru">Русский</option>
        <option value="tr">Türkçe</option>
        <option value="pl">Polski</option>
        <option value="ja">日本語</option>
        <option value="ko">한국어</option>
        <option value="zh-hans" selected>简体中文</option>
        <option value="zh-hant">繁體中文</option>
        <option value="hi">हिन्दी</option>
        <option value="ar">العربية</option>
      </select>
    </div>
  </div>
</footer>

<script type="application/json" id="outbound-words">{"js.copied":"已复制","js.copy":"复制","js.copyKey":"复制激活码","js.copyKeyTitle":"复制你的激活码","js.emailInvalid":"这个邮箱地址看起来不对。","js.feedbackEmpty":"请先写点什么。","js.feedbackLong":"最多 2000 个字。","js.feedbackSent":"谢谢，已经发出。","js.finding":"正在查找你的激活码…","js.formBusy":"尝试次数过多，请等一分钟。","js.formFailed":"没有发送成功，请再试一次。","js.offline":"无法连接商店。试试点击“激活”，或查看你的客户中心。","js.paste":"打开 Outbound，粘贴你的激活码。","js.portal":"你的激活码在下方的客户中心里。","js.pressCopy":"按 ⌘C 复制你的激活码。","js.refunded":"这笔购买已退款。","js.slow":"比平时花的时间长。试试点击“激活”，或过一分钟再查看你的客户中心。","js.unfinished":"这次付款没有完成。","js.waitlistIos":"已加入名单。Outbound 登陆 iPhone 时，只发一封邮件。","js.waitlistWindows":"已加入名单。Outbound 登陆 Windows 时，只发一封邮件。"}</script>
<script>
// Starts this page's scripts. The site's Content Security Policy runs this script alone, by its hash, and what it
// starts ('strict-dynamic'), so it is the same on every page and starts only the site's own files and Plausible.
// scripts/build-site-languages.mjs checks every page carries it unchanged and writes its hash into _headers.
(function () {
  var missing = document.documentElement.getAttribute("data-page") === "404";
  var page = missing ? null : (location.pathname.match(/(?:^|\/)(thanks|feedback|waitlist)(?:\.html)?$/) || [])[1];
  // The checkout id, and any customer session token Polar adds, come off the address bar at once, so they stay out
  // of history, bookmarks and screenshots. The id lives on in this tab only.
  if (page === "thanks") {
    var id = new URLSearchParams(location.search).get("checkout_id");
    try {
      if (id) sessionStorage.setItem("outbound-checkout", id);
      else id = sessionStorage.getItem("outbound-checkout");
    } catch (error) {}
    window.OUTBOUND_CHECKOUT = id;
    if (location.search) history.replaceState(null, "", location.pathname);
  }
  // Plausible's queue, ready before its script arrives. A thank-you page gives it only the page, since its address
  // can hold a checkout that fetches a key; a missing page counts as a 404, with the address asked for.
  window.plausible = window.plausible || function () { (plausible.q = plausible.q || []).push(arguments); };
  plausible.init = plausible.init || function (i) { plausible.o = i || {}; };
  if (page === "thanks") {
    plausible.init({ transformRequest: function (request) { request.u = request.u.split("?")[0]; return request; } });
  } else {
    plausible.init();
  }
  if (missing) plausible("404");
  // Addresses go through a Trusted Types policy where the browser has them, which takes these and nothing else.
  var urls = {
    plausible: "https://plausible.io/js/pa-UjwzQoq8qX6tVKev_Xvxo.js",
    app: "/app.js?v=16",
    thanks: "/thanks.js?v=8",
    feedback: "/feedback.js?v=2",
    waitlist: "/waitlist.js?v=3"
  };
  var policy = window.trustedTypes && trustedTypes.createPolicy("outbound", {
    createScriptURL: function (url) {
      for (var name in urls) if (urls[name] === url) return url;
      throw new TypeError("Not one of Outbound's scripts: " + url);
    }
  });
  function start(name, async) {
    var script = document.createElement("script");
    script.src = policy ? policy.createScriptURL(urls[name]) : urls[name];
    script.async = async;
    document.body.appendChild(script);
  }
  start("plausible", true);
  // The page's own scripts run in this order, as they would from tags here.
  start("app", false);
  if (page) start(page, false);
})();
</script>
</body>
