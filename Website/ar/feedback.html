<body class="fill">

<header class="topbar">

<main class="page">

    <!-- Posts, so nothing written here ends up in a page's address. feedback.js sends it and answers in place. -->
    <form class="page-form" id="feedback" action="/api/feedback" method="post" novalidate>
      <textarea class="field" name="message" required maxlength="2000" rows="6" placeholder="ملاحظاتك" aria-label="ملاحظاتك"
                data-i18n-attr="placeholder=feedback.message aria-label=feedback.message"></textarea>
      <div class="form-row">
        <input class="field" type="email" name="email" maxlength="254" autocomplete="email" inputmode="email" spellcheck="false" autocapitalize="off"
               placeholder="بريدك الإلكتروني (اختياري)" aria-label="بريدك الإلكتروني (اختياري)" data-i18n-attr="placeholder=feedback.email aria-label=feedback.email">
        <button class="btn btn-light" type="submit" data-i18n="feedback.button">إرسال</button>
      </div>
      <!-- Left empty by people, filled in by bots. -->
      <div class="trap" aria-hidden="true"><label>Leave this empty <input type="text" name="hp" tabindex="-1" autocomplete="off"></label></div>
      <p class="form-status" id="feedback-status" role="alert"></p>
    </form>
    <p class="form-done" id="feedback-done" role="status" tabindex="-1" hidden></p>
  </div>
</main>

<script>
// Starts this page's scripts. The site's Content Security Policy runs this script alone, by its hash, and what it
// starts ('strict-dynamic'), so it is the same on every page and starts only the site's own files and Plausible.
// scripts/build-site-languages.mjs checks every page carries it unchanged and writes its hash into _headers.
(function () {
  var missing = document.documentElement.getAttribute("data-page") === "404";
  var page = missing ? null : (location.pathname.match(/(?:^|\/)(thanks|feedback|waitlist)(?:\.html)?$/) || [])[1];
  // The checkout id, and any customer session token Polar adds, come off the address bar at once, so they stay out
  // of history, bookmarks and screenshots. The id lives on in this tab only.
  if (page === "thanks") {
    var id = new URLSearchParams(location.search).get("checkout_id");
    try {
      if (id) sessionStorage.setItem("outbound-checkout", id);
      else id = sessionStorage.getItem("outbound-checkout");
    } catch (error) {}
    window.OUTBOUND_CHECKOUT = id;
    if (location.search) history.replaceState(null, "", location.pathname);
  }
  // Plausible's queue, ready before its script arrives. A thank-you page gives it only the page, since its address
  // can hold a checkout that fetches a key; a missing page counts as a 404, with the address asked for.
  window.plausible = window.plausible || function () { (plausible.q = plausible.q || []).push(arguments); };
  plausible.init = plausible.init || function (i) { plausible.o = i || {}; };
  if (page === "thanks") {
    plausible.init({ transformRequest: function (request) { request.u = request.u.split("?")[0]; return request; } });
  } else {
    plausible.init();
  }
  if (missing) plausible("404");
  // Addresses go through a Trusted Types policy where the browser has them, which takes these and nothing else.
  var urls = {
    plausible: "https://plausible.io/js/pa-UjwzQoq8qX6tVKev_Xvxo.js",
    app: "/app.js?v=16",
    thanks: "/thanks.js?v=8",
    feedback: "/feedback.js?v=2",
    waitlist: "/waitlist.js?v=3"
  };
  var policy = window.trustedTypes && trustedTypes.createPolicy("outbound", {
    createScriptURL: function (url) {
      for (var name in urls) if (urls[name] === url) return url;
      throw new TypeError("Not one of Outbound's scripts: " + url);
    }
  });
  function start(name, async) {
    var script = document.createElement("script");
    script.src = policy ? policy.createScriptURL(urls[name]) : urls[name];
    script.async = async;
    document.body.appendChild(script);
  }
  start("plausible", true);
  // The page's own scripts run in this order, as they would from tags here.
  start("app", false);
  if (page) start(page, false);
})();
</script>
