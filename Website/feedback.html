<!DOCTYPE html>
<!-- Site URLs (download, buy, github) live once, at the top of app.js. The form is feedback.js, and worker/index.js keeps
     what it sends. Not for search engines, so it has no other languages listed. -->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title data-i18n="feedback.metaTitle">Feedback · Outbound</title>
<meta name="description" content="Tell the person who made Outbound what works, what doesn't, and what you'd like next." data-i18n-attr="content=feedback.metaDescription">
<link rel="canonical" href="https://outbound.edbn.me/feedback">
<meta name="robots" content="noindex">
<meta name="theme-color" content="#000000">
<meta property="og:type" content="website">
<meta property="og:url" content="https://outbound.edbn.me/feedback">
<meta property="og:title" content="Feedback · Outbound" data-i18n-attr="content=feedback.metaTitle">
<meta property="og:description" content="Tell the person who made Outbound what works, what doesn't, and what you'd like next." data-i18n-attr="content=feedback.metaDescription">
<meta property="og:image" content="https://outbound.edbn.me/assets/og.jpg">
<meta property="og:image:type" content="image/jpeg">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta property="og:image:alt" content="Outbound: a painted world, flying by behind your desktop." data-i18n-attr="content=meta.imageAlt">
<meta property="og:site_name" content="Outbound">
<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:title" content="Feedback · Outbound" data-i18n-attr="content=feedback.metaTitle">
<meta name="twitter:description" content="Tell the person who made Outbound what works, what doesn't, and what you'd like next." data-i18n-attr="content=feedback.metaDescription">
<meta name="twitter:image" content="https://outbound.edbn.me/assets/og.jpg">
<meta name="twitter:image:alt" content="Outbound: a painted world, flying by behind your desktop." data-i18n-attr="content=meta.imageAlt">
<link rel="icon" type="image/svg+xml" href="/assets/favicon.svg?v=3">
<link rel="apple-touch-icon" href="/assets/apple-touch-icon.png">
<link rel="stylesheet" href="/styles.css?v=22">
<!-- Privacy-friendly analytics by Plausible -->
<script async src="https://plausible.io/js/pa-UjwzQoq8qX6tVKev_Xvxo.js"></script>
<script>
  window.plausible=window.plausible||function(){(plausible.q=plausible.q||[]).push(arguments)},plausible.init=plausible.init||function(i){plausible.o=i||{}};
  plausible.init()
</script>
</head>
<body class="fill">

<header class="topbar">
  <div class="wrap topbar-inner">
    <a class="mark-logo" href="/" aria-label="Outbound home" data-i18n-attr="aria-label=nav.home"><span class="mark mark-md" aria-hidden="true"></span></a>
    <div class="topbar-actions">
      <a class="btn btn-dark btn-sm" href="https://github.com/kewonit/outbound" data-url="github">GitHub</a>
      <a class="btn btn-light btn-sm" href="/#buy" data-url="buy" data-soon="Coming soon" data-i18n="buy.button" data-i18n-attr="data-soon=buy.soon">Buy for $4.99</a>
    </div>
  </div>
</header>

<main class="page">
  <div class="wrap-narrow prose">
    <h1 data-i18n="feedback.title">Feedback.</h1>
    <p class="lede" data-i18n="feedback.lede">What works, what doesn't, what you'd like next. It goes straight to the person who made Outbound.</p>

    <!-- Posts, so nothing written here ends up in a page's address. feedback.js sends it and answers in place. -->
    <form class="page-form" id="feedback" action="/api/feedback" method="post" novalidate>
      <textarea class="field" name="message" required maxlength="2000" rows="6" placeholder="Your feedback" aria-label="Your feedback"
                data-i18n-attr="placeholder=feedback.message aria-label=feedback.message"></textarea>
      <div class="form-row">
        <input class="field" type="email" name="email" maxlength="254" autocomplete="email" inputmode="email" spellcheck="false" autocapitalize="off"
               placeholder="Your email (optional)" aria-label="Your email (optional)" data-i18n-attr="placeholder=feedback.email aria-label=feedback.email">
        <button class="btn btn-light" type="submit" data-i18n="feedback.button">Send</button>
      </div>
      <!-- Left empty by people, filled in by bots. -->
      <div class="trap" aria-hidden="true"><label>Leave this empty <input type="text" name="hp" tabindex="-1" autocomplete="off"></label></div>
      <p class="form-status" id="feedback-status" role="alert"></p>
    </form>
    <p class="form-done" id="feedback-done" role="status" tabindex="-1" hidden></p>
  </div>
</main>

<footer class="footer footer-plain">
  <div class="wrap-narrow">
    <p class="form-fine" data-i18n="feedback.fine">Only the person who made Outbound reads it. Your email is used just to reply. <a href="/privacy">Privacy</a></p>
    <div class="lang-picker">
      <label for="language" data-i18n="footer.language">Language</label>
      <select id="language" data-lang-picker>
        <option value="en">English</option>
        <option value="es">Español</option>
        <option value="fr">Français</option>
        <option value="de">Deutsch</option>
        <option value="it">Italiano</option>
        <option value="pt-br">Português (Brasil)</option>
        <option value="nl">Nederlands</option>
        <option value="ru">Русский</option>
        <option value="tr">Türkçe</option>
        <option value="pl">Polski</option>
        <option value="ja">日本語</option>
        <option value="ko">한국어</option>
        <option value="zh-hans">简体中文</option>
        <option value="zh-hant">繁體中文</option>
        <option value="hi">हिन्दी</option>
        <option value="ar">العربية</option>
      </select>
    </div>
  </div>
</footer>

<script src="/app.js?v=15"></script>
<script src="/feedback.js?v=1"></script>
</body>
</html>
