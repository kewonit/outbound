<link rel="canonical" href="https://outbound.edbn.me/ko/feedback">
<meta name="robots" content="noindex">
<meta name="theme-color" content="#000000">
<meta property="og:type" content="website">
<meta property="og:url" content="https://outbound.edbn.me/ko/feedback">
<meta property="og:title" content="피드백 · Outbound" data-i18n-attr="content=feedback.metaTitle">
<meta property="og:description" content="좋은 점, 아쉬운 점, 다음에 바라는 점을 Outbound를 만든 사람에게 알려 주세요." data-i18n-attr="content=feedback.metaDescription">

<meta name="twitter:title" content="피드백 · Outbound" data-i18n-attr="content=feedback.metaTitle">
<meta name="twitter:description" content="좋은 점, 아쉬운 점, 다음에 바라는 점을 Outbound를 만든 사람에게 알려 주세요." data-i18n-attr="content=feedback.metaDescription">
<meta name="twitter:image" content="https://outbound.edbn.me/assets/og.jpg">

<body class="fill">

<header class="topbar">
  <div class="wrap topbar-inner">
    <a class="mark-logo" href="/ko/" aria-label="Outbound 홈" data-i18n-attr="aria-label=nav.home"><span class="mark mark-md" aria-hidden="true"></span></a>
    <div class="topbar-actions">
      <a class="btn btn-dark btn-sm" href="https://github.com/kewonit/outbound" data-url="github">GitHub</a>
      <a class="btn btn-light btn-sm" href="/ko/#buy" data-url="buy" data-soon="곧 출시" data-i18n="buy.button" data-i18n-attr="data-soon=buy.soon">$7에 구입하기</a>
    </div>
  </div>
</header>

<main class="page">
  <div class="wrap-narrow prose">
    <h1 data-i18n="feedback.title">피드백.</h1>
    <p class="lede" data-i18n="feedback.lede">좋은 점, 아쉬운 점, 다음에 바라는 점. Outbound를 만든 사람에게 바로 전달됩니다.</p>

    <!-- Posts, so nothing written here ends up in a page's address. feedback.js sends it and answers in place. -->
    <form class="page-form" id="feedback" action="/api/feedback" method="post" novalidate>
      <textarea class="field" name="message" required maxlength="2000" rows="6" placeholder="피드백" aria-label="피드백"
                data-i18n-attr="placeholder=feedback.message aria-label=feedback.message"></textarea>
      <div class="form-row">
        <input class="field" type="email" name="email" maxlength="254" autocomplete="email" inputmode="email" spellcheck="false" autocapitalize="off"
               placeholder="이메일 주소(선택)" aria-label="이메일 주소(선택)" data-i18n-attr="placeholder=feedback.email aria-label=feedback.email">
        <button class="btn btn-light" type="submit" data-i18n="feedback.button">보내기</button>
      </div>
      <!-- Left empty by people, filled in by bots. -->
      <div class="trap" aria-hidden="true"><label>Leave this empty <input type="text" name="hp" tabindex="-1" autocomplete="off"></label></div>
      <p class="form-status" id="feedback-status" role="alert"></p>
    </form>
    <p class="form-done" id="feedback-done" role="status" tabindex="-1" hidden></p>
  </div>
</main>

<footer class="footer footer-plain">
  <div class="wrap-narrow">
    <p class="form-fine" data-i18n="feedback.fine">Outbound를 만든 사람만 읽습니다. 이메일 주소는 답장에만 사용합니다. <a href="/privacy">개인정보 처리방침(영문)</a></p>
    <div class="lang-picker">
      <label for="language" data-i18n="footer.language">언어</label>
      <select id="language" data-lang-picker>
        <option value="en">English</option>
        <option value="es">Español</option>
        <option value="fr">Français</option>
        <option value="de">Deutsch</option>
        <option value="it">Italiano</option>
        <option value="pt-br">Português (Brasil)</option>
        <option value="nl">Nederlands</option>
        <option value="ru">Русский</option>
        <option value="tr">Türkçe</option>
        <option value="pl">Polski</option>
        <option value="ja">日本語</option>
        <option value="ko" selected>한국어</option>
        <option value="zh-hans">简体中文</option>
        <option value="zh-hant">繁體中文</option>
        <option value="hi">हिन्दी</option>
        <option value="ar">العربية</option>
      </select>
    </div>
  </div>
</footer>
