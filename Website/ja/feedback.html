<link rel="canonical" href="https://outbound.edbn.me/ja/feedback">
<meta name="robots" content="noindex">
<meta name="theme-color" content="#000000">
<meta property="og:type" content="website">
<meta property="og:url" content="https://outbound.edbn.me/ja/feedback">
<meta property="og:title" content="フィードバック · Outbound" data-i18n-attr="content=feedback.metaTitle">

<meta name="twitter:title" content="フィードバック · Outbound" data-i18n-attr="content=feedback.metaTitle">
<meta name="twitter:description" content="よかったこと、困ったこと、これから欲しいものを、Outboundを作った本人に伝えてください。" data-i18n-attr="content=feedback.metaDescription">
<meta name="twitter:image" content="https://outbound.edbn.me/assets/og.jpg">
<meta name="twitter:image:alt" content="Outbound：デスクトップの奥を流れていく、描かれた世界。" data-i18n-attr="content=meta.imageAlt">

<script async src="https://plausible.io/js/pa-UjwzQoq8qX6tVKev_Xvxo.js"></script>
<script>
  window.plausible=window.plausible||function(){(plausible.q=plausible.q||[]).push(arguments)},plausible.init=plausible.init||function(i){plausible.o=i||{}};
  plausible.init()

<body class="fill">

<header class="topbar">
  <div class="wrap topbar-inner">
    <a class="mark-logo" href="/ja/" aria-label="Outboundホーム" data-i18n-attr="aria-label=nav.home"><span class="mark mark-md" aria-hidden="true"></span></a>
    <div class="topbar-actions">
      <a class="btn btn-dark btn-sm" href="https://github.com/kewonit/outbound" data-url="github">GitHub</a>
      <a class="btn btn-light btn-sm" href="/ja/#buy" data-url="buy" data-soon="近日公開" data-i18n="buy.button" data-i18n-attr="data-soon=buy.soon">$4.99で購入</a>
    </div>
  </div>
</header>

<main class="page">
  <div class="wrap-narrow prose">
    <h1 data-i18n="feedback.title">フィードバック</h1>
    <p class="lede" data-i18n="feedback.lede">よかったこと、困ったこと、これから欲しいもの。Outboundを作った本人に直接届きます。</p>

    <!-- Posts, so nothing written here ends up in a page's address. feedback.js sends it and answers in place. -->
    <form class="page-form" id="feedback" action="/api/feedback" method="post" novalidate>
      <textarea class="field" name="message" required maxlength="2000" rows="6" placeholder="フィードバック" aria-label="フィードバック"
                data-i18n-attr="placeholder=feedback.message aria-label=feedback.message"></textarea>
      <div class="form-row">
        <input class="field" type="email" name="email" maxlength="254" autocomplete="email" inputmode="email" spellcheck="false" autocapitalize="off"
               placeholder="メールアドレス（任意）" aria-label="メールアドレス（任意）" data-i18n-attr="placeholder=feedback.email aria-label=feedback.email">
        <button class="btn btn-light" type="submit" data-i18n="feedback.button">送信</button>
      </div>
      <!-- Left empty by people, filled in by bots. -->
      <div class="trap" aria-hidden="true"><label>Leave this empty <input type="text" name="hp" tabindex="-1" autocomplete="off"></label></div>
      <p class="form-status" id="feedback-status" role="alert"></p>
    </form>
    <p class="form-done" id="feedback-done" role="status" tabindex="-1" hidden></p>
  </div>
</main>

<footer class="footer footer-plain">
  <div class="wrap-narrow">
    <p class="form-fine" data-i18n="feedback.fine">読むのはOutboundを作った本人だけです。メールアドレスは返信にのみ使います。<a href="/privacy">プライバシー（英語）</a></p>
    <div class="lang-picker">
      <label for="language" data-i18n="footer.language">言語</label>
      <select id="language" data-lang-picker>
        <option value="en">English</option>
        <option value="es">Español</option>
        <option value="fr">Français</option>
        <option value="de">Deutsch</option>
        <option value="it">Italiano</option>
        <option value="pt-br">Português (Brasil)</option>
        <option value="nl">Nederlands</option>
        <option value="ru">Русский</option>
        <option value="tr">Türkçe</option>
        <option value="pl">Polski</option>
        <option value="ja" selected>日本語</option>
        <option value="ko">한국어</option>
        <option value="zh-hans">简体中文</option>
        <option value="zh-hant">繁體中文</option>
        <option value="hi">हिन्दी</option>
        <option value="ar">العربية</option>
      </select>
    </div>
  </div>
</footer>

<script>window.OUTBOUND_I18N = {"js.copied":"コピーしました","js.copy":"コピー","js.copyKey":"キーをコピー","js.copyKeyTitle":"ライセンスキーをコピー","js.emailInvalid":"メールアドレスが正しくないようです。","js.feedbackEmpty":"まず何か書いてください。","js.feedbackLong":"2000文字以内でお願いします。","js.feedbackSent":"ありがとうございます。送信しました。","js.finding":"ライセンスキーを探しています…","js.formBusy":"試行回数が多すぎます。1分ほどお待ちください。","js.formFailed":"送信できませんでした。もう一度お試しください。","js.offline":"ストアに接続できませんでした。「有効にする」をお試しいただくか、カスタマーポータルをご確認ください。","js.portal":"ライセンスキーは、下のカスタマーポータルにあります。","js.pressCopy":"⌘Cを押して、キーをコピーしてください。","js.refunded":"この購入は返金されています。","js.slow":"いつもより時間がかかっています。「有効にする」をお試しいただくか、少ししてからカスタマーポータルをご確認ください。","js.unfinished":"このお支払いは完了していません。","js.waitlistIos":"登録しました。Outbound が iPhone に対応したら、1通だけお知らせします。","js.waitlistWindows":"登録しました。Outbound が Windows に対応したら、1通だけお知らせします。"};</script>
<script src="/app.js?v=15"></script>

</body>
</html>
